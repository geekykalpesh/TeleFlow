name: Build & Release TeleFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools icnsutils graphicsmagick libglib2.0-dev libsecret-1-dev

      - name: Compile & Build Frontend
        run: npm run build

      - name: Build & Publish Electron Executables
        run: npx electron-builder --config.npmRebuild=false --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "TeleFlow v1.0.3 — Multi-Platform Ultra Speed Release"
          body: |
            ## 🚀 TeleFlow v1.0.3 Official Release

            **TeleFlow** is a production-ready, high-speed desktop Telegram client & sequential media downloader engineered for multi-worker parallel downloads, Telegram link range parsing, full-channel automatic syncing, and isolated transfer dashboards.

            ---

            ### ✨ Highlights & Features in v1.0.3

            - **⚡ Turbo Multi-Worker Download Engine**: Opens **8 parallel MTProto TCP sockets per file** with 512 KB chunk payloads, yielding download speeds up to **15 MB/s - 45+ MB/s**.
            - **🔗 Telegram Link Range Parsing**: Paste any Telegram message link (`https://t.me/c/3429930878/642`) into Range selection fields to download exact message spans.
            - **🔁 Unlimited Full-Channel Auto-Sync**: Automatically pages through complete channel history (80 to 80,000+ files) without truncation or page cutoffs.
            - **🔑 Seamless 3-Step Login Flow**: Smooth step transitions (Credentials -> Telegram App OTP -> 2FA Password) without modal popups closing mid-login.
            - **📡 Per-Channel Dashboard Isolation**: Dedicated UI card for every channel with real-time download speeds (`MB/s`), remaining ETAs, and byte progress bars.
            - **⏸️ Granular Pause / Resume / Retry**: Instant transfer abortion with byte-offset resumption from existing `.part` files.

            ---

            ### 📦 Download Assets (v1.0.3)

            - 🪟 **Windows**: `TeleFlow Setup 1.0.3.exe` (NSIS Installer) & `TeleFlow 1.0.3.exe` (Portable)
            - 🍎 **macOS**: `TeleFlow-1.0.3.dmg` & `TeleFlow-1.0.3-mac.zip`
            - 🐧 **Linux**: `TeleFlow-1.0.3.AppImage` & `teleflow_1.0.3_amd64.deb`
          files: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
