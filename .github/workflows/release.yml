name: Build & Release TeleFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools icnsutils graphicsmagick libglib2.0-dev libsecret-1-dev

      - name: Compile & Build Frontend
        run: npm run build

      - name: Build & Package Electron Executables
        run: npx electron-builder --config.npmRebuild=false --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "TeleFlow ${{ github.ref_name }} Release"
          body: |
            ## 🚀 TeleFlow ${{ github.ref_name }} Official Release

            **TeleFlow** is a production-ready, high-speed desktop Telegram client & sequential media downloader engineered for multi-worker parallel downloads, Telegram link range parsing, full-channel automatic syncing, and isolated transfer dashboards.

            ---

            ### ✨ Release Notes & Fixes in ${{ github.ref_name }}

            - **📝 Sequential Post Text & Resource Links Storage**: Automatically extracts post text captions and resolved embedded resource links (such as `≫ Resource` links, Drive URLs, Notion notes) into structured `.txt` files sitting in exact numerical sequence alongside media files (`001_video.mp4`, `002_video_info.txt`, `003_video2.mp4`).
            - **🔗 Telegram Post URL & Topic Link Resolution**: Pasting Telegram post URLs or forum topic URLs (e.g., `https://t.me/c/2586510339/3578/3580`) directly into the search bar or message ID inputs automatically resolves the channel, populates message/topic ranges, and opens the channel thread directly.
            - **⚡ Authenticated MTProto Media Streamer**: Native `iterDownload` stream engine for continuous, high-speed transfers without cross-DC authorization key errors.
            - **⚙️ Advanced Content Filtering & Rules Engine**: Filter downloads by Min/Max file size (MB), Include/Exclude keywords matching filenames and captions, and skip duplicate files on disk.

            ---

            ### 📦 Download Assets (${{ github.ref_name }})

            - 🪟 **Windows**: `TeleFlow Setup.exe` (NSIS Desktop Installer)
            - 🍎 **macOS**: `TeleFlow.dmg` (Mac Disk Image)
            - 🐧 **Linux**: `TeleFlow.AppImage` (Linux Portable Executable)
          files: |
            release/*/*Setup*.exe
            release/*/*.dmg
            release/*/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
