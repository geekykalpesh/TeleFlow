name: Build & Release TeleFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools icnsutils graphicsmagick libglib2.0-dev libsecret-1-dev

      - name: Compile & Build Frontend
        run: npm run build

      - name: Build & Publish Electron Executables
        run: npx electron-builder --config.npmRebuild=false --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "TeleFlow ${{ github.ref_name }} Release"
          body: |
            ## 🚀 TeleFlow ${{ github.ref_name }} Official Release

            **TeleFlow** is a production-ready, high-speed desktop Telegram client & sequential media downloader engineered for multi-worker parallel downloads, Telegram link range parsing, full-channel automatic syncing, and isolated transfer dashboards.

            ---

            ### ✨ Release Notes & Fixes in ${{ github.ref_name }}

            - **🔒 Secure Local Credential Vault**: Zero credentials hardcoded in codebase. Personal sessions are stored strictly on your local PC (`AppData`) and seamlessly preserved across all application updates without re-logging in.
            - **🚀 Max-Speed Continuous Download Engine**: Persistent 20-connection MTProto DC pool, 4 MB high-throughput disk write buffer, and up to 10 parallel file workers (continuous max ISP bandwidth up to 100+ MB/s).
            - **⚙️ Advanced Content Filtering & Rules Engine**: Filter downloads by Min/Max file size (MB), Include/Exclude keywords matching filenames and captions, and skip duplicate files on disk.
            - **🗑️ Delete Specific Channel Cards**: Added explicit card deletion options for all channel cards & forum topic sub-cards (with choice to remove from list or delete files on disk).
            - **⏸️ Per-Card Download Controls**: Turn downloads ON or OFF per card ("don't want to download them").
            - **🔄 Per-Card Auto-Sync Controls**: Turn auto-sync ON or OFF per card ("don't want to sync them again" / "want to sync them").
            - **🔗 Telegram Link Range Parsing**: Paste any Telegram message link into Range selection fields to download exact message spans.

            ---

            ### 📦 Download Assets (${{ github.ref_name }})

            - 🪟 **Windows**: `TeleFlow Setup.exe` (NSIS Installer) & Portable Executable
            - 🍎 **macOS**: `.dmg` & `-mac.zip`
            - 🐧 **Linux**: `.AppImage` & `.deb`
          files: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
