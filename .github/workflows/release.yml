name: Build & Release TeleFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools icnsutils graphicsmagick libglib2.0-dev libsecret-1-dev

      - name: Compile & Build Frontend
        run: npm run build

      - name: Build & Package Electron Executables
        run: npx electron-builder --config.npmRebuild=false --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "TeleFlow ${{ github.ref_name }} Release"
          body: |
            ## 🚀 TeleFlow ${{ github.ref_name }} Official Release

            **TeleFlow** is a production-ready, high-speed desktop Telegram client & sequential media downloader engineered for multi-worker parallel downloads, Telegram link range parsing, full-channel automatic syncing, and isolated transfer dashboards.

            ---

            ### ✨ Release Notes & Fixes in ${{ github.ref_name }}

            - **⚡ Authenticated MTProto Media Streamer**: Replaced unauthenticated secondary sender pool with GramJS's native `iterDownload` stream engine. Resolves cross-DC authorization key errors and guarantees continuous, uninterrupted downloads across all media channels!
            - **🖼️ Application & Windows Taskbar Icon Fix**: Added `nativeImage` multi-format icon resolution (`icon.ico` / `icon.png`), ensuring the TeleFlow logo displays cleanly in the Windows Installer Header, App Title Bar, System Tray, and Taskbar!
            - **🐛 Fixed Queue Worker Concurrency Slider Reset**: Resolved issue where moving the Queue Worker Concurrency slider in Application Settings reset back to 1 upon saving. Concurrency setting is now permanently stored in SQLite and persisted across application restarts.
            - **🧹 Clean Release Installer Assets**: Streamlined release binaries to clean single setup installers (`.exe`, `.dmg`, `.AppImage`) and removed all intermediate blockmaps, metadata ymls, and duplicate packages.
            - **🔒 Secure Local Credential Vault**: Zero credentials hardcoded in codebase. Personal sessions are stored strictly on your local PC (`AppData`) and seamlessly preserved across all application updates without re-logging in.
            - **⚙️ Advanced Content Filtering & Rules Engine**: Filter downloads by Min/Max file size (MB), Include/Exclude keywords matching filenames and captions, and skip duplicate files on disk.

            ---

            ### 📦 Download Assets (${{ github.ref_name }})

            - 🪟 **Windows**: `TeleFlow Setup.exe` (NSIS Desktop Installer)
            - 🍎 **macOS**: `TeleFlow.dmg` (Mac Disk Image)
            - 🐧 **Linux**: `TeleFlow.AppImage` (Linux Portable Executable)
          files: |
            release/*/*Setup*.exe
            release/*/*.dmg
            release/*/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
